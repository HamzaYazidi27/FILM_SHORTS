[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortsengine"
version = "0.1.0"
description = "Autonomous, evidence-driven YouTube Shorts production engine (DNA-configured)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.75",
  "httpx>=0.27",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "pillow>=10.3",
  "edge-tts>=7.0",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# fully local, no API keys (Kokoro TTS everywhere; FLUX via MLX on Apple Silicon)
local = ["kokoro-onnx>=0.4", "soundfile>=0.12", "mflux>=0.9; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8", "yt-dlp"]

[project.scripts]
shortsengine = "shortsengine.cli:main"

[tool.setuptools.packages.find]
include = ["shortsengine*"]

[tool.setuptools.package-data]
shortsengine = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call real external services (deselect with -m 'not network')"]
